name: Supabase Keepalive

on:
  schedule:
    # Runs every Monday at 08:00 UTC to prevent Supabase free tier inactivity pause
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            curl -f -s -o /dev/null -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/" || echo "Supabase ping finished."
          else
            echo "SUPABASE_URL secret is not set, skipping keepalive ping."
          fi

